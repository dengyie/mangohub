name: Build frontend theme
description: Build the default (komari-web) and vendored deer themes, and optionally upload them as an artifact.

inputs:
  node-version:
    description: Node.js version used to build komari-web.
    default: "23"
  repository:
    description: Optional frontend repository URL (uses local web/admin when empty).
    default: ""
  ref:
    description: Optional komari-web ref to build. Uses the repository default branch when empty.
    default: ""
  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install zstd
      shell: bash
      run: |
        set -euxo pipefail
        if ! command -v zstd >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y zstd
        fi

    - name: Clone and build frontend
      shell: bash
      run: |
        set -euxo pipefail
        ADMIN_DIR=""
        if [ -d "web/admin" ]; then
          ADMIN_DIR="web/admin"
        elif [ -n "${{ inputs.repository }}" ]; then
          rm -rf komari-web
          if [ -n "${{ inputs.ref }}" ]; then
            git clone --depth=1 --branch "${{ inputs.ref }}" "${{ inputs.repository }}" komari-web
          else
            git clone --depth=1 "${{ inputs.repository }}" komari-web
          fi
          ADMIN_DIR="komari-web"
        else
          echo "No web/admin or repository found; using pre-packaged defaultTheme if present"
        fi

        if [ -n "$ADMIN_DIR" ]; then
          cd "$ADMIN_DIR"
          npm install
          npm run build
          cd -

          mkdir -p web/public/defaultTheme
          rm -rf web/public/defaultTheme/dist web/public/defaultTheme/dist.tar.zst
          test -f "$ADMIN_DIR/dist/index.html"
          tar -cf "$RUNNER_TEMP/komari-default-dist.tar" -C "$ADMIN_DIR/dist" .
          zstd -19 -T0 -q -f "$RUNNER_TEMP/komari-default-dist.tar" -o web/public/defaultTheme/dist.tar.zst
          rm -f "$RUNNER_TEMP/komari-default-dist.tar"
          cp -f "$ADMIN_DIR/komari-theme.json" web/public/defaultTheme/
          if [ -f "$ADMIN_DIR/preview.png" ]; then cp -f "$ADMIN_DIR/preview.png" web/public/defaultTheme/; fi
          if [ -f "$ADMIN_DIR/perview.png" ]; then cp -f "$ADMIN_DIR/perview.png" web/public/defaultTheme/; fi
          if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then cp -f web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png; fi
          if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then cp -f web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png; fi
        fi

    - name: Build vendored deer theme
      shell: bash
      run: |
        set -euxo pipefail
        if [ -f web/theme/komari-deer/package.json ]; then
          (
            cd web/theme/komari-deer
            npm ci
            npm run build
          )
          mkdir -p web/public/deerTheme/dist
          rm -rf web/public/deerTheme/dist/*
          cp -r web/theme/komari-deer/dist/* web/public/deerTheme/dist/
          cp -f web/theme/komari-deer/komari-theme.json web/public/deerTheme/
          if [ -f web/theme/komari-deer/preview.png ]; then cp -f web/theme/komari-deer/preview.png web/public/deerTheme/; fi
        else
          echo "No vendored deer theme found; skipping deer build"
        fi

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C web/public defaultTheme deerTheme

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
