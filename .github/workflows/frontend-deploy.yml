name: Frontend checks and deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'hub/web/theme/komari-deer/**'
      - '!hub/web/theme/komari-deer/docs/**'
      - 'hub/scripts/deploy-theme.py'
      - 'hub/tests/test_deploy_theme.py'
      - '.github/workflows/frontend-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'hub/web/theme/komari-deer/**'
      - '!hub/web/theme/komari-deer/docs/**'
      - 'hub/scripts/deploy-theme.py'
      - 'hub/tests/test_deploy_theme.py'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/web/theme/komari-deer/package-lock.json
      - name: Test deployment receiver
        run: python3 -m unittest discover -s hub/tests -p 'test_deploy_theme.py' -v
      - name: Install and verify frontend
        working-directory: hub/web/theme/komari-deer
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Package versioned theme
        working-directory: hub/web/theme/komari-deer
        run: |
          set -euo pipefail
          printf '{"revision":"%s"}\n' "$GITHUB_SHA" > dist/frontend-release.json
          tar -czf "$RUNNER_TEMP/mangohub-theme.tar.gz" dist komari-theme.json
          cd "$RUNNER_TEMP"
          sha256sum mangohub-theme.tar.gz > mangohub-theme.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mangohub-theme
          path: |
            ${{ runner.temp }}/mangohub-theme.tar.gz
            ${{ runner.temp }}/mangohub-theme.sha256
          retention-days: 14

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mangohub-theme
      - name: Verify artifact and current main
        run: |
          set -euo pipefail
          sha256sum -c mangohub-theme.sha256
          git fetch --no-tags --depth=1 origin main
          test "$GITHUB_SHA" = "$(git rev-parse FETCH_HEAD)"
      - name: Deploy through restricted SSH command
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HK_HOST }}
          port: ${{ secrets.HK_PORT }}
          username: ${{ secrets.HK_USER }}
          key: ${{ secrets.HK_SSH_KEY }}
          source: mangohub-theme.tar.gz
          target: /tmp
          overwrite: true

      - name: Activate theme through receiver
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        with:
          host: ${{ secrets.HK_HOST }}
          port: ${{ secrets.HK_PORT }}
          username: ${{ secrets.HK_USER }}
          key: ${{ secrets.HK_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_REVISION
          script: |
            set -eu
            archive=/tmp/mangohub-theme.tar.gz
            checksum="$(sha256sum "$archive" | cut -d ' ' -f1)"
            sudo env SSH_ORIGINAL_COMMAND="deploy $DEPLOY_REVISION $checksum" \
              python3 /home/mango/mangohub/hub/scripts/deploy-theme.py < "$archive"
