name: Mangohub CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  agent-check:
    name: Agent Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: agent/go.sum

      - name: Run go vet on Agent
        run: |
          cd agent
          go vet ./...

      - name: Build Agent
        run: |
          cd agent
          CGO_ENABLED=0 go build -trimpath -o ../bin/mango-agent .

      - name: Run Agent Tests
        run: |
          cd agent
          go test -v $(go list ./... | grep -v '/server')

  hub-check:
    name: Hub Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: hub/go.sum

      - name: Run go vet on Hub
        run: |
          cd hub
          go vet ./...

      - name: Build Hub
        run: |
          cd hub
          CGO_ENABLED=1 go build -trimpath -o ../bin/mangohub .
